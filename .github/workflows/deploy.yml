name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      - name: Prepare production artifact
        run: |
          mkdir -p dist/assets dist/public/gh-pages
          cp public/gh-pages/index.prod.html dist/index.html
          cp public/gh-pages/index.prod.html dist/404.html
          cp public/gh-pages/*.js public/gh-pages/*.css dist/assets/
          cp public/gh-pages/*.js public/gh-pages/*.css dist/public/gh-pages/
          if [ -d "public/assets" ]; then
            cp -r public/assets/* dist/assets/ 2>/dev/null || true
          fi
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
