    <script>
      // In AI Studio, HMR is disabled. Handle Vite Module Runner transport gracefully
      // to eliminate "WebSocket closed without opened." errors behind Cloud Run proxies.
      (function () {
        var OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          window.WebSocket = function (url, protocols) {
            var urlStr = String(url || '');
            if (
              protocols === 'vite-hmr' ||
              urlStr.indexOf('vite-hmr') !== -1 ||
              urlStr.indexOf('24678') !== -1 ||
              (urlStr.indexOf('token=') !== -1 && urlStr.indexOf('/@vite') !== -1)
            ) {
              return {
                readyState: 1,
                OPEN: 1,
                CLOSED: 3,
                CONNECTING: 0,
                CLOSING: 2,
                addEventListener: function (type, listener) {
                  if (type === 'open' && typeof listener === 'function') {
                    setTimeout(listener, 0);
                  }
                },
                removeEventListener: function () {},
                dispatchEvent: function () { return true; },
                send: function () {},
                close: function () {},
              };
            }
            return new OriginalWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OriginalWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          if (
            reason &&
            (String(reason.message || '').indexOf('WebSocket') !== -1 ||
              String(reason.stack || '').indexOf('@vite/client') !== -1 ||
              String(reason.message || '').indexOf('vite-hmr') !== -1)
          ) {
            event.preventDefault();
          }
        });
        window.addEventListener('error', function (event) {
          if (
            (event.filename && event.filename.indexOf('@vite/client') !== -1) ||
            (event.message && event.message.indexOf('WebSocket') !== -1)
          ) {
            event.preventDefault();
          }
        });
      })();
    </script>
